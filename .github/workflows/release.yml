# Pushing a tag like v0.2.0 checks, zips and submits that version to the
# Chrome Web Store and Firefox Add-ons for review. The first upload to each has
# to be made by hand in its developer dashboard; this only ships updates to
# existing listings.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Two tags pushed close together would race to submit; let them queue instead
concurrency: release

jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

      # The zip is named after package.json's version; `npm version` bumps it
      # and makes the matching tag together
      - run: npm run zip

      - name: Submit to Chrome Web Store
        run: npx wxt submit --chrome-zip .output/*-chrome.zip
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}

  # A job of its own, so a store that refuses the version can be re-run alone
  firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

      # Also makes the sources zip: the build is bundled and minified, so AMO
      # reviewers rebuild it from source
      - run: npm run zip:firefox

      - name: Submit to Firefox Add-ons
        run: >-
          npx wxt submit
          --firefox-zip .output/*-firefox.zip
          --firefox-sources-zip .output/*-sources.zip
        env:
          # the gecko id in wxt.config.ts
          FIREFOX_EXTENSION_ID: canvas-plus-plus@aretelew
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
